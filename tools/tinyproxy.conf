# tinyproxy config for reaching IPv6-only-reachable trackers from Docker.
#
# Why: 1337x has banned our IPv4 address but not our IPv6 one. macOS has
# working IPv6, but Colima's Linux VM has none at all (no global addresses,
# no egress), so containers fall back to the banned IPv4 and get Cloudflare
# error 1006. Tunnelling through a proxy on the host sends the traffic out
# over the host's IPv6 instead.
#
# tinyproxy uses the system resolver, and macOS follows RFC 6724 (IPv6
# first) - which is exactly why a normal browser on this machine reaches
# 1337x fine. No special flag needed.
#
# CONNECT only pipes bytes, so TLS stays end-to-end between the browser and
# the tracker: the browser's TLS fingerprint is unchanged, only the egress
# address differs.
#
# Run:  tinyproxy -d -c tools/tinyproxy.conf

Port 8888
Listen 0.0.0.0
Timeout 600

# Only the Docker/Colima network and localhost may use this proxy. Without
# these lines tinyproxy would be an open relay on the LAN.
Allow 127.0.0.1
Allow ::1
Allow 192.168.5.0/24
Allow 172.16.0.0/12
Allow 10.0.0.0/8

# HTTPS tunnelling. Trackers are https-only, so this is all that's needed.
ConnectPort 443
ConnectPort 563

StartServers 2
MaxClients 20
LogLevel Warning
