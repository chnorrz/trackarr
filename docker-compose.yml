# Deploys trackarr alongside an existing Prowlarr Docker stack, plus an
# optional tinyproxy sidecar for trackers that ban an IPv4 address while
# leaving IPv6 clean (see NOTES.md section 4 - currently 1337x).
#
# Usage:
#   1. Update the "media_default" network name below (both the trackarr
#      service and the networks: block) if Prowlarr isn't on a network with
#      that name:
#      docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' prowlarr
#   2. docker compose up -d
#   3. In Prowlarr, add each provider as a generic Torznab indexer. Example:
#        URL: http://trackarr:9117/ext-to
#        API Key: whatever you set below
#
# If your host doesn't need the IPv6 workaround (only 1337x does, and only if
# your IPv4 happens to be banned - see NOTES.md section 4 to check), delete
# the tinyproxy service, the PROXY_URL env line, and the trackarr-net network,
# and just put trackarr on your Prowlarr network directly.

services:
  trackarr:
    image: ghcr.io/chnorrz/trackarr:latest
    container_name: trackarr
    restart: unless-stopped
    environment:
      # CHANGE THIS - generate your own, e.g. `openssl rand -hex 24`, and use
      # the same value when adding trackarr as an indexer in Prowlarr.
      API_KEY: changeme
      PROXY_URL: http://tinyproxy:8888
      # PROXY_URL alone does nothing - no provider is proxied unless it's
      # also explicitly named here. Not set by default since needing this at
      # all is specific to your situation (see NOTES.md section 4) - add it
      # yourself, e.g. PROXY_PROVIDERS: "1337x"
    volumes:
      - trackarr-data:/data
    networks:
      - media_default   # external: Prowlarr's existing network, join it to be reachable by name
      - trackarr-net     # private: only shared with the tinyproxy sidecar

  tinyproxy:
    image: ghcr.io/chnorrz/trackarr-tinyproxy:latest
    container_name: trackarr-tinyproxy
    restart: unless-stopped
    environment:
      # Must match the trackarr-net subnet below - if you change one, change
      # both. Only requests from this subnet are allowed through the proxy.
      ALLOWED_SUBNET: 172.28.99.0/24
      # Only needed if 1337x's ban is on your IPv4 specifically and your host
      # has real IPv6 (see NOTES.md section 4) - forces tinyproxy's outgoing
      # connections onto its own IPv6 address rather than letting IPv4/IPv6
      # racing pick whichever connects first, with no awareness that IPv4
      # leads to the ban. Set to "false" (or remove) if you don't need this.
      FORCE_IPV6: "true"
    networks:
      - trackarr-net     # not on media_default - nothing else can reach it

networks:
  media_default:
    external: true       # rename to match Prowlarr's actual network if different
  trackarr-net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.99.0/24
        - subnet: fd00:dead:beef:99::/64

volumes:
  trackarr-data:
