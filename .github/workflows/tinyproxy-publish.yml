name: Publish tinyproxy sidecar image

# Publishes docker/tinyproxy/ to GHCR alongside the main trackarr image, so
# docker-compose.yml can `image:` it instead of `build:` it - a local build
# context isn't available in every deployment method (e.g. Portainer stacks
# deployed by pasting/uploading just the compose file, without the repo tree
# alongside it).
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-tinyproxy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      # Single job, both architectures via QEMU: unlike the main image, this
      # is just `apt-get install tinyproxy` with no native compilation and no
      # multi-hundred-MB downloads, so emulation cost is negligible and the
      # native-runner-plus-merge setup the main image uses would be overkill.
      - uses: docker/build-push-action@v6
        with:
          context: docker/tinyproxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
